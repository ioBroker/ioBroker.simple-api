# This is a composition of lint and test scripts
# Make sure to update this file along with the others

name: Test and Release

# Run this job on all pushes and pull requests
# as well as tags with a semantic version
on:
    push:
        branches:
            - '*'
        tags:
            # normal versions
            - 'v?[0-9]+.[0-9]+.[0-9]+'
            # pre-releases
            - 'v?[0-9]+.[0-9]+.[0-9]+-**'
    pull_request: {}

# Cancel previous PR/branch runs when a new commit is pushed
concurrency:
    group: ${{ github.ref }}
    cancel-in-progress: true

jobs:
    # Performs quick checks before the expensive test runs
    check-and-lint:
        if: contains(github.event.head_commit.message, '[skip ci]') == false

        runs-on: ubuntu-latest

        steps:
            - uses: ioBroker/testing-action-check@v1
              with:
                  node-version: '22.x'
                  # package-lock.json is not in the repository
                  install-command: 'npm i'
                  package-cache: 'false'
                  type-checking: true
                  lint: true

    # Runs adapter tests on all supported node versions and OSes
    adapter-tests:
        if: contains(github.event.head_commit.message, '[skip ci]') == false

        needs: [check-and-lint]

        runs-on: ${{ matrix.os }}
        strategy:
            matrix:
                node-version: [22.x, 24.x, 26.x]
                os: [ubuntu-latest, windows-latest, macos-latest]

        steps:
            - uses: ioBroker/testing-action-adapter@v1
              with:
                  node-version: ${{ matrix.node-version }}
                  os: ${{ matrix.os }}
                  # package-lock.json is not in the repository
                  install-command: 'npm i'
                  package-cache: 'false'
                  build: true

    # Deploys the final package to NPM and creates the GitHub release
    deploy:
        needs: [check-and-lint, adapter-tests]

        # Permissions are required to create GitHub releases and for npm trusted publishing
        permissions:
            contents: write
            id-token: write

        # Trigger this step only when a commit on any branch is tagged with a version number
        if: |
            contains(github.event.head_commit.message, '[skip ci]') == false &&
            github.event_name == 'push' &&
            startsWith(github.ref, 'refs/tags/v')

        runs-on: ubuntu-latest

        steps:
            - uses: ioBroker/testing-action-deploy@v1
              with:
                  node-version: '24.x'
                  # package-lock.json is not in the repository
                  install-command: 'npm i'
                  package-cache: 'false'
                  build: true
                  github-token: ${{ secrets.GITHUB_TOKEN }}
                  sentry: true
                  sentry-token: ${{ secrets.SENTRY_AUTH_TOKEN }}
                  sentry-project: 'iobroker-simple-api'
                  sentry-version-prefix: 'iobroker.simple-api'
                  sentry-url: 'https://sentry.iobroker.net'
                  sentry-org: 'iobroker'
